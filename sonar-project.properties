# sonar.organization e passado via -D pelo workflow (.github/workflows/ci.yml), nao aqui -
# sonar-project.properties nao interpola variavel de ambiente.
sonar.projectKey=sv-frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/environments/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

<div class="login">
  <app-panel [title]="'login.title' | transloco">
    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.slugLabel' | transloco }}</mat-label>
        <input matInput type="text" formControlName="slug" data-testid="login-slug" autocomplete="organization" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.emailLabel' | transloco }}</mat-label>
        <input matInput type="email" formControlName="email" data-testid="login-email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.passwordLabel' | transloco }}</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          data-testid="login-password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (errorMessage(); as message) {
        <p class="login__error" role="alert" data-testid="login-error">{{ message }}</p>
      }

      <button mat-flat-button type="submit" data-testid="login-submit" [disabled]="form.invalid || submitting()">
        {{ 'login.submit' | transloco }}
      </button>
    </form>
  </app-panel>
</div>

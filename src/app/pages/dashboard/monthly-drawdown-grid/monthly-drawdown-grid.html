<form [formGroup]="filterForm" (ngSubmit)="applyFilter()" class="monthly-drawdown-grid__filter">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'monthlyDrawdown.fromLabel' | transloco }}</mat-label>
    <input
      matInput
      readonly
      [matDatepicker]="fromPicker"
      formControlName="fromMonth"
      data-testid="monthly-drawdown-from"
    />
    <mat-datepicker-toggle matIconSuffix [for]="fromPicker" data-testid="monthly-drawdown-from-toggle" />
    <mat-datepicker
      #fromPicker
      startView="year"
      (monthSelected)="onMonthSelected($event, fromPicker, 'fromMonth')"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'monthlyDrawdown.toLabel' | transloco }}</mat-label>
    <input
      matInput
      readonly
      [matDatepicker]="toPicker"
      formControlName="toMonth"
      data-testid="monthly-drawdown-to"
    />
    <mat-datepicker-toggle matIconSuffix [for]="toPicker" data-testid="monthly-drawdown-to-toggle" />
    <mat-datepicker
      #toPicker
      startView="year"
      (monthSelected)="onMonthSelected($event, toPicker, 'toMonth')"
    />
  </mat-form-field>

  <button mat-flat-button type="submit" data-testid="monthly-drawdown-apply" [disabled]="filterForm.invalid">
    {{ 'monthlyDrawdown.apply' | transloco }}
  </button>
</form>

<app-chart-frame
  [title]="'charts.drawdown.title' | transloco"
  [help]="'charts.drawdown.help' | transloco"
  [legend]="[{ label: 'charts.drawdown.legend' | transloco, colorToken: '--color-brand' }]"
  testId="monthly-drawdown-chart-frame"
>
  @if (loadError(); as message) {
    <p class="monthly-drawdown-grid__error" role="alert" data-testid="monthly-drawdown-error">{{ message }}</p>
  } @else if (months().length === 0) {
    <p class="monthly-drawdown-grid__empty" data-testid="monthly-drawdown-empty">
      {{ 'monthlyDrawdown.emptyResult' | transloco }}
    </p>
  } @else {
    <div class="monthly-drawdown-grid__grid" data-testid="monthly-drawdown-grid">
      @for (month of months(); track trackMonth($index, month)) {
        <app-monthly-drawdown-chart [month]="month" />
      }
    </div>
  }
</app-chart-frame>

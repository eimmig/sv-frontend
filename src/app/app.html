@if (showSplash()) {
  <app-splash (done)="onSplashDone()" />
}
<div class="app-shell">
  @if (auth.isAuthenticated()) {
    <app-side-nav />
  }
  <div class="app-shell__main">
    @if (auth.isAuthenticated()) {
      <app-must-change-password-banner />
    } @else {
      <div class="app-shell__floating-controls">
        <app-language-selector />
        <app-theme-toggle />
      </div>
    }
    <div class="app-shell__content">
      <router-outlet />
    </div>
  </div>
</div>

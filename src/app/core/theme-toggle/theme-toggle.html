<button
  mat-icon-button
  type="button"
  class="theme-toggle"
  data-testid="theme-toggle"
  [attr.aria-label]="(theme.current() === 'dark' ? 'theme.switchToLight' : 'theme.switchToDark') | transloco"
  (click)="theme.toggle()"
>
  <mat-icon>{{ theme.current() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
</button>

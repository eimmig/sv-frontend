@if (auth.mustChangePassword() && !dismissed()) {
  <output class="banner" data-testid="must-change-password-banner">
    <span>{{ 'mustChangePassword.message' | transloco }}</span>
    <a mat-button routerLink="/change-password" data-testid="must-change-password-action">
      {{ 'mustChangePassword.action' | transloco }}
    </a>
    <button mat-button type="button" data-testid="must-change-password-dismiss" (click)="dismiss()">
      {{ 'mustChangePassword.dismiss' | transloco }}
    </button>
  </output>
}

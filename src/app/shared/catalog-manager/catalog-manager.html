<div class="catalog-manager">
  <form [formGroup]="form" (ngSubmit)="submit()" class="catalog-manager__form">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'catalogs.nameLabel' | transloco }}</mat-label>
      <input
        matInput
        type="text"
        formControlName="name"
        data-testid="catalog-manager-name"
        [attr.aria-label]="'catalogs.nameLabel' | transloco"
      />
    </mat-form-field>

    @if (formError(); as message) {
      <p class="catalog-manager__error" role="alert" data-testid="catalog-manager-form-error">{{ message }}</p>
    }

    <button
      mat-flat-button
      type="submit"
      data-testid="catalog-manager-submit"
      [disabled]="form.invalid || submitting()"
    >
      {{ 'catalogs.create' | transloco }}
    </button>
  </form>

  @if (loadError(); as message) {
    <p class="catalog-manager__error" role="alert" data-testid="catalog-manager-load-error">{{ message }}</p>
  } @else {
    <ul class="catalog-manager__list" data-testid="catalog-manager-list">
      @for (entry of entries(); track entry.id) {
        <li data-testid="catalog-manager-row">{{ entry.name }}</li>
      }
    </ul>
  }
</div>

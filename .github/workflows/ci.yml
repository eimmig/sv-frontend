name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Changelog - ver docs/CI-CD.md (vault local, nao versionado neste repo)
      - name: Validar atualizacao do CHANGELOG.md
        # So no PR story -> develop/main, ver docs/CI-CD.md "Quais passos rodam em qual PR":
        # a linha de cada subtask nasce (via jira_story.py) antes da branch daquela subtask
        # existir, entao o diff de uma PR subtask/ -> story nunca toca CHANGELOG.md por
        # sequenciamento, nao por esquecimento real - exigir o toque tambem ali quebraria todo
        # PR de subtask.
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. Chaves de traducao - ver docs/CONVENTIONS.md secao "Internacionalizacao (i18n)"
      - name: Validar chaves de traducao (pt-BR/en-US/es)
        # Guarda propria (public/i18n/pt-BR.json), independente do package-lock.json que
        # guarda os passos 3-5: package-lock.json nasce bem antes dos arquivos de locale -
        # guardar so por package-lock.json quebraria a PR de toda subtask intermediaria por
        # sequenciamento, nao por defeito real.
        if: hashFiles('public/i18n/pt-BR.json') != ''
        run: |
          python3 .github/scripts/validate-i18n-keys.py --format json \
            --file pt-BR=public/i18n/pt-BR.json \
            --file en-US=public/i18n/en-US.json \
            --file es=public/i18n/es.json

      - uses: actions/setup-node@v4
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 24
          cache: npm

      # 3. Build
      - name: Build
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run build

      # 4. Testes unitarios + cobertura
      - name: Testes unitarios e cobertura
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        run: npm run test -- --coverage --watch=false

      # 5. Qualidade de codigo e cobertura (SonarCloud)
      - name: SonarCloud
        # Pulado em PR de subtask: cobertura parcial de uma feature em andamento
        # reprovaria o quality gate sem indicar defeito real.
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Ver docs/CI-CD.md.
        # sonar.qualitygate.wait pulado em qualquer push direto (main incluso, nao so develop):
        # a primeira analise de uma branch longa sem leak period definido devolve status NONE,
        # tratado como reprovado pelo plugin. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            ${{ github.event_name != 'push' && '-Dsonar.qualitygate.wait=true' || '' }}

      # 6. Gate de issue/hotspot do SonarCloud - pulado em qualquer push direto (mesmo racional do passo 5)
      - name: Validar zero issues no SonarCloud
        if: hashFiles('package-lock.json') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main') && github.event_name != 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          python3 .github/scripts/validate-sonar-issues.py
          --project-key eimmig_sv-frontend
          ${{ github.event_name == 'pull_request' && format('--pull-request {0}', github.event.pull_request.number) || format('--branch {0}', github.ref_name) }}

  build-and-push-image:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eimmig/sv-frontend:${{ github.sha }}
            ghcr.io/eimmig/sv-frontend:latest

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # kubectl ja vem preinstalado no runner ubuntu-latest - sem action de terceiro
      - name: Configurar kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Reiniciar deployment
        run: kubectl rollout restart deployment/web

  release:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Calcula a proxima versao a partir de Conventional Commits desde a ultima tag - so
      # calcula, nao cria a tag (isso e o passo "Criar tag e GitHub Release" mais abaixo).
      # github.token de leitura basta aqui, nada disto e bloqueado por branch protection.
      - name: Calcular proxima versao (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noVersionBumpBehavior: patch

      # --no-git-tag-version: so escreve package.json/package-lock.json, nao cria tag/commit
      # proprio (isso ja e feito manualmente no passo de commit mais abaixo).
      # --allow-same-version: nao falha se rodar de novo com o mesmo numero.
      - name: Atualizar versao no package.json
        run: npm version ${{ steps.semver.outputs.nextStrict }} --no-git-tag-version --allow-same-version

      - name: Validar JSON do package.json apos o bump
        run: python3 -c "import json; json.load(open('package.json'))"

      - name: Cortar CHANGELOG.md
        run: python3 .github/scripts/cut-changelog.py CHANGELOG.md ${{ steps.semver.outputs.nextStrict }}

      # main tem required status check "pipeline" - o GITHUB_TOKEN padrao roda como
      # github-actions[bot], que nao e admin e seria rejeitado empurrando um commit novo
      # (nenhum check rodou pra ele ainda). RELEASE_TOKEN (PAT do dono/admin, ver
      # docs/pipeline-ci-cd.md) bypassa isso do mesmo jeito que um push manual do dono
      # bypassaria - usado so aqui, embutido na URL (vida curta de um comando), nunca
      # persistido no credential helper (persist-credentials: false acima). [skip ci] evita
      # o loop: PAT (diferente de GITHUB_TOKEN) dispara o workflow de novo por padrao.
      - name: Commit e push da release
        id: release-commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.semver.outputs.next }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $NEXT_VERSION [skip ci]"
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # commit: aponta explicitamente pro commit que acabou de ser empurrado (o bump) -
      # sem isso a action usaria o commit que disparou o job, ANTES do bump.
      - name: Criar tag e GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          commit: ${{ steps.release-commit.outputs.sha }}
          token: ${{ github.token }}
          generateReleaseNotes: true

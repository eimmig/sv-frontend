name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Changelog - ver docs/CI-CD.md (vault local, nao versionado neste repo)
      - name: Validar atualizacao do CHANGELOG.md
        # Todo PR valida, inclusive subtask -> branch da story: cada subtarefa adiciona a
        # propria linha em [Unreleased], que se acumula ate o merge em develop.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. Chaves de traducao - ver docs/CONVENTIONS.md secao "Internacionalizacao (i18n)"
      - name: Validar chaves de traducao (pt-BR/en-US/es)
        # Guarda propria (src/assets/i18n/pt-BR.json), independente do package-lock.json que
        # guarda os passos 3-5: feat-001 deste app foi dividida em subtasks incrementais e
        # package-lock.json nasce (feat-001.1, ng new) bem antes dos arquivos de locale
        # (feat-001.3, transloco) - guardar so por package-lock.json quebraria a PR de toda
        # subtask intermediaria por sequenciamento, nao por defeito real. Achado real (SV-210):
        # mesma armadilha ja documentada em docs/CI-CD.md ("Gotcha encontrado em sv-auth-backend")
        # e corrigida proativamente nos 4 repositorios Java, nunca portada pra este ate agora.
        if: hashFiles('src/assets/i18n/pt-BR.json') != ''
        run: |
          python3 .github/scripts/validate-i18n-keys.py --format json \
            --file pt-BR=src/assets/i18n/pt-BR.json \
            --file en-US=src/assets/i18n/en-US.json \
            --file es=src/assets/i18n/es.json

      - uses: actions/setup-node@v4
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 24
          cache: npm

      # 3. Build
      - name: Build
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run build

      # 4. Testes unitarios + cobertura
      - name: Testes unitarios e cobertura
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != ''
        run: npm run test -- --coverage --watch=false

      # 5. Qualidade de codigo e cobertura (SonarCloud)
      - name: SonarCloud
        # Pulado em PR de subtask: cobertura parcial de uma feature em andamento
        # reprovaria o quality gate sem indicar defeito real.
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('package-lock.json') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io

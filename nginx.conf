server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: qualquer rota nao encontrada como arquivo cai no index.html,
    # o Angular Router resolve client-side (ex.: /login, /dashboard apos F5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
